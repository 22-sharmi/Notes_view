<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<<link rel="icon" href="https://cdn-icons-png.flaticon.com/128/3985/3985004.png">
<title>ClassView</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}


/* =========================================================
   STUDENT HOME PAGE
   ========================================================= */

#homePage {
    max-width: 1100px;
    margin: 35px auto;
    padding: 20px;
}

.student-content {
    background: white;
    min-height: 600px;
    padding: 35px;
    border-radius: 12px;

    font-size: 18px;
    line-height: 1.75;

    overflow-wrap: anywhere;

    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -webkit-touch-callout: none;
}

.student-content h1 {
    font-size: 32px;
    margin-top: 0;
}

.student-content h2 {
    font-size: 26px;
    margin-top: 30px;
}

.student-content h3 {
    font-size: 22px;
    margin-top: 25px;
}

.student-content ul,
.student-content ol {
    padding-left: 30px;
}

.placeholder {
    color: #999;
}


/* =========================================================
   STUDENT CODE
   ========================================================= */

.student-code {
    background: #1e1e1e;
    color: #d4d4d4;

    border-radius: 8px;

    margin: 20px 0;

    overflow-x: auto;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 15px;

    line-height: 1.6;

    user-select: none;
}

.student-code-title {
    background: #252526;
    color: #aaa;

    padding: 7px 12px;

    font-family: Arial, sans-serif;
    font-size: 12px;

    border-bottom: 1px solid #333;
}

.student-code-content {
    display: flex;

    align-items: flex-start;
}

.student-line-numbers {
    padding: 12px 12px;

    text-align: right;

    color: #858585;

    background: #1e1e1e;

    border-right: 1px solid #333;

    min-width: 50px;

    user-select: none;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 15px;

    line-height: 1.6;
}

.student-code-lines {
    padding: 12px 16px;

    white-space: pre;

    flex: 1;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 15px;

    line-height: 1.6;

    margin: 0;
}


/* IMPORTANT:
   Every individual code line gets the
   exact same height and spacing.
*/

.student-code-line {
    display: block;

    height: 24px;

    line-height: 24px;

    margin: 0;

    padding: 0;
}


/* =========================================================
   SYNTAX COLORS
   ========================================================= */

.syntax-keyword {
    color: #569cd6;
}

.syntax-type {
    color: #4ec9b0;
}

.syntax-function {
    color: #dcdcaa;
}

.syntax-number {
    color: #b5cea8;
}

.syntax-string {
    color: #ce9178;
}

.syntax-comment {
    color: #6a9955;
}

.syntax-constant {
    color: #4fc1ff;
}


/* =========================================================
   ME PAGE
   ========================================================= */

#mePage {
    display: none;

    min-height: 100vh;

    background: #f1f3f5;
}


/* =========================================================
   HEADER
   ========================================================= */

.editor-header {

    height: 60px;

    background: #111827;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    position: sticky;

    top: 0;

    z-index: 100;
}

.editor-title {

    font-size: 20px;

    font-weight: bold;
}

.editor-actions {

    display: flex;

    gap: 8px;
}

.editor-actions button {

    border: none;

    padding: 9px 16px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;
}

.clear-button {

    background: #ef4444;

    color: white;
}


/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar {

    background: white;

    border-bottom: 1px solid #ddd;

    padding: 10px 15px;

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    position: sticky;

    top: 60px;

    z-index: 99;
}

.toolbar button {

    border: 1px solid #ccc;

    background: white;

    padding: 7px 12px;

    border-radius: 5px;

    cursor: pointer;

    font-size: 14px;
}

.toolbar button:hover {

    background: #eeeeee;
}


/* =========================================================
   NOTES EDITOR
   ========================================================= */

.notes-container {

    max-width: 1100px;

    margin: 25px auto;

    padding: 0 20px;
}

.notes-editor {

    width: 100%;

    min-height: 300px;

    background: white;

    border: 1px solid #d1d5db;

    border-radius: 10px;

    padding: 25px;

    outline: none;

    font-size: 18px;

    line-height: 1.7;

    resize: vertical;
}

.notes-editor:focus {

    border-color: #777;
}


/* =========================================================
   CODE SECTION
   ========================================================= */

.code-editor-section {

    max-width: 1100px;

    margin: 25px auto;

    padding: 0 20px;
}

.code-editor-header {

    background: #252526;

    color: #ddd;

    padding: 10px 14px;

    border-radius: 8px 8px 0 0;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.language-select {

    background: #333;

    color: white;

    border: 1px solid #555;

    padding: 5px 8px;

    border-radius: 4px;
}


/* =========================================================
   REAL CODE EDITOR
   ========================================================= */

.code-editor {

    display: flex;

    width: 100%;

    height: 500px;

    background: #1e1e1e;

    border-radius: 0 0 8px 8px;

    overflow: hidden;

    border: 1px solid #333;
}


/* LINE NUMBERS */

.code-numbers {

    width: 55px;

    flex-shrink: 0;

    background: #1e1e1e;

    color: #858585;

    text-align: right;

    padding: 14px 12px;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 15px;

    line-height: 1.6;

    border-right: 1px solid #333;

    overflow: hidden;

    user-select: none;
}


/* TEXTAREA */

#codeInput {

    flex: 1;

    width: 100%;

    height: 100%;

    background: #1e1e1e;

    color: #d4d4d4;

    border: none;

    outline: none;

    resize: none;

    padding: 14px 16px;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 15px;

    line-height: 1.6;

    tab-size: 2;

    white-space: pre;

    overflow: auto;
}


/* CODE BUTTONS */

.code-buttons {

    margin-top: 10px;

    display: flex;

    gap: 8px;
}

.code-buttons button {

    border: none;

    padding: 9px 15px;

    border-radius: 5px;

    cursor: pointer;

    background: #2563eb;

    color: white;
}

.code-buttons button:hover {

    background: #1d4ed8;
}


/* =========================================================
   PREVIEW
   ========================================================= */

.preview-section {

    max-width: 1100px;

    margin: 30px auto 60px;

    padding: 0 20px;
}

.preview-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;
}

.preview-box {

    background: white;

    border-radius: 10px;

    padding: 30px;

    min-height: 200px;

    border: 1px solid #ddd;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 700px) {

    .student-content {

        padding: 20px;

        font-size: 16px;
    }

    .notes-editor {

        padding: 18px;
    }

    .editor-title {

        font-size: 17px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     STUDENT PAGE
     ========================================================= -->

<div id="homePage">

    <div
        id="studentContent"
        class="student-content"

        oncontextmenu="return false;"
        oncopy="return false;"
        oncut="return false;"
        ondragstart="return false;"
    >

        <span class="placeholder">
            Content will appear here.
        </span>

    </div>

</div>



<!-- =========================================================
     ME PAGE
     ========================================================= -->

<div id="mePage">


    <div class="editor-header">

        <div class="editor-title">
            ClassView Editor
        </div>

        <div class="editor-actions">

            <button
                class="clear-button"
                onclick="clearEverything()"
            >
                Clear
            </button>

        </div>

    </div>



    <div class="toolbar">

        <button onclick="formatText('bold')">
            <b>B</b>
        </button>

        <button onclick="formatText('italic')">
            <i>I</i>
        </button>

        <button onclick="formatText('underline')">
            <u>U</u>
        </button>

        <button onclick="formatBlock('h1')">
            H1
        </button>

        <button onclick="formatBlock('h2')">
            H2
        </button>

        <button onclick="formatBlock('h3')">
            H3
        </button>

        <button onclick="formatText('insertUnorderedList')">
            • List
        </button>

        <button onclick="formatText('insertOrderedList')">
            1. List
        </button>

    </div>



    <!-- NOTES -->

    <div class="notes-container">

        <div
            id="notesEditor"
            class="notes-editor"
            contenteditable="true"
        ></div>

    </div>



    <!-- CODE EDITOR -->

    <div class="code-editor-section">

        <div class="code-editor-header">

            <span>
                Code Editor
            </span>

            <select
                id="language"
                class="language-select"
                onchange="languageChanged()"
            >

                <option value="arduino">
                    Arduino / C++
                </option>

                <option value="python">
                    Python
                </option>

                <option value="javascript">
                    JavaScript
                </option>

            </select>

        </div>


        <div class="code-editor">

            <div
                id="codeNumbers"
                class="code-numbers"
            ></div>


            <textarea
                id="codeInput"
                spellcheck="false"
                placeholder="// Type or paste your code here..."
            ></textarea>

        </div>


        <div class="code-buttons">

            <button onclick="saveCode()">
                Add / Update Code
            </button>

            <button onclick="clearCode()">
                Clear Code
            </button>

        </div>

    </div>



    <!-- PREVIEW -->

    <div class="preview-section">

        <div class="preview-title">
            Student Preview
        </div>

        <div
            id="editorPreview"
            class="preview-box"
        ></div>

    </div>

</div>



<script>


/* =========================================================
   ELEMENTS
   ========================================================= */

const homePage =
    document.getElementById("homePage");

const mePage =
    document.getElementById("mePage");

const studentContent =
    document.getElementById("studentContent");

const notesEditor =
    document.getElementById("notesEditor");

const codeInput =
    document.getElementById("codeInput");

const codeNumbers =
    document.getElementById("codeNumbers");

const language =
    document.getElementById("language");

const editorPreview =
    document.getElementById("editorPreview");


/* =========================================================
   PAGE
   ========================================================= */

function checkPage() {

    if (window.location.search === "?me") {

        homePage.style.display = "none";

        mePage.style.display = "block";

        loadEverything();

    } else {

        homePage.style.display = "block";

        mePage.style.display = "none";

        loadStudentPage();

    }

}


/* =========================================================
   LOAD EDITOR
   ========================================================= */

function loadEverything() {

    const notes =
        localStorage.getItem("classViewNotes");

    const code =
        localStorage.getItem("classViewCode");

    const savedLanguage =
        localStorage.getItem("classViewLanguage");


    if (notes) {

        notesEditor.innerHTML =
            notes;

    }


    if (code) {

        codeInput.value =
            code;

    }


    if (savedLanguage) {

        language.value =
            savedLanguage;

    }


    updateCodeNumbers();

    updatePreview();

}


/* =========================================================
   LOAD STUDENT PAGE
   ========================================================= */

function loadStudentPage() {

    const notes =
        localStorage.getItem("classViewNotes");

    const code =
        localStorage.getItem("classViewCode");

    const savedLanguage =
        localStorage.getItem("classViewLanguage");


    let html = "";


    if (notes) {

        html += notes;

    }


    if (code && code.trim() !== "") {

        html += createStudentCode(
            code,
            savedLanguage || "arduino"
        );

    }


    if (html.trim() !== "") {

        studentContent.innerHTML =
            html;

    } else {

        studentContent.innerHTML =
            '<span class="placeholder">Content will appear here.</span>';

    }

}


/* =========================================================
   NOTES SAVE
   ========================================================= */

notesEditor.addEventListener(
    "input",
    function() {

        localStorage.setItem(
            "classViewNotes",
            notesEditor.innerHTML
        );

        updatePreview();

    }
);


/* =========================================================
   FORMATTING
   ========================================================= */

function formatText(command) {

    notesEditor.focus();

    document.execCommand(
        command,
        false,
        null
    );

    localStorage.setItem(
        "classViewNotes",
        notesEditor.innerHTML
    );

    updatePreview();

}


function formatBlock(tag) {

    notesEditor.focus();

    document.execCommand(
        "formatBlock",
        false,
        tag
    );

    localStorage.setItem(
        "classViewNotes",
        notesEditor.innerHTML
    );

    updatePreview();

}


/* =========================================================
   CODE LINE NUMBERS
   ========================================================= */

function updateCodeNumbers() {

    const lineCount =
        codeInput.value.split("\n").length;

    let html = "";

    for (
        let i = 1;
        i <= lineCount;
        i++
    ) {

        html += i + "<br>";

    }

    codeNumbers.innerHTML =
        html;

}


/* =========================================================
   CODE INPUT
   ========================================================= */

codeInput.addEventListener(
    "input",
    function() {

        updateCodeNumbers();

    }
);


/* =========================================================
   CODE SCROLL
   ========================================================= */

codeInput.addEventListener(
    "scroll",
    function() {

        codeNumbers.scrollTop =
            codeInput.scrollTop;

    }
);


/* =========================================================
   TAB
   ========================================================= */

codeInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Tab") {

            event.preventDefault();

            const start =
                codeInput.selectionStart;

            const end =
                codeInput.selectionEnd;


            codeInput.value =
                codeInput.value.substring(
                    0,
                    start
                )
                +
                "  "
                +
                codeInput.value.substring(
                    end
                );


            codeInput.selectionStart =
                start + 2;

            codeInput.selectionEnd =
                start + 2;


            updateCodeNumbers();

        }

    }
);


/* =========================================================
   SAVE CODE
   ========================================================= */

function saveCode() {

    localStorage.setItem(
        "classViewCode",
        codeInput.value
    );

    localStorage.setItem(
        "classViewLanguage",
        language.value
    );

    updatePreview();

}


/* =========================================================
   CLEAR CODE
   ========================================================= */

function clearCode() {

    codeInput.value = "";

    localStorage.removeItem(
        "classViewCode"
    );

    updateCodeNumbers();

    updatePreview();

}


/* =========================================================
   LANGUAGE
   ========================================================= */

function languageChanged() {

    localStorage.setItem(
        "classViewLanguage",
        language.value
    );

    updatePreview();

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

}


/* =========================================================
   HIGHLIGHT CODE
   ========================================================= */

function highlightCode(
    code,
    selectedLanguage
) {

    let text =
        escapeHTML(code);


    /* COMMENTS */

    if (
        selectedLanguage === "arduino" ||
        selectedLanguage === "javascript"
    ) {

        text = text.replace(
            /(\/\/.*)/g,

            '<span class="syntax-comment">$1</span>'
        );

    }


    if (
        selectedLanguage === "python"
    ) {

        text = text.replace(
            /(#.*)/g,

            '<span class="syntax-comment">$1</span>'
        );

    }


    /* STRINGS */

    text = text.replace(
        /(&quot;.*?&quot;|&#39;.*?&#39;)/g,

        '<span class="syntax-string">$1</span>'
    );


    /* KEYWORDS */

    text = text.replace(
        /\b(void|int|float|double|char|bool|if|else|for|while|return|const|static|switch|case|break|continue|true|false|def|class|import|from|as|in|and|or|not|None|function|let|var|new|this)\b/g,

        '<span class="syntax-keyword">$1</span>'
    );


    /* TYPES */

    text = text.replace(
        /\b(String|byte|long|unsigned|boolean|list|dict|tuple)\b/g,

        '<span class="syntax-type">$1</span>'
    );


    /* ARDUINO */

    text = text.replace(
        /\b(HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|LED_BUILTIN|SERIAL|LSBFIRST|MSBFIRST)\b/g,

        '<span class="syntax-constant">$1</span>'
    );


    /* NUMBERS */

    text = text.replace(
        /\b\d+(\.\d+)?\b/g,

        '<span class="syntax-number">$&</span>'
    );


    /* FUNCTIONS */

    text = text.replace(
        /\b([A-Za-z_][A-Za-z0-9_]*)\s*(?=\()/g,

        '<span class="syntax-function">$1</span>'
    );


    return text;

}


/* =========================================================
   STUDENT CODE
   ========================================================= */

function createStudentCode(
    code,
    selectedLanguage
) {

    const names = {

        arduino:
            "Arduino / C++",

        python:
            "Python",

        javascript:
            "JavaScript"

    };


    const title =
        names[selectedLanguage]
        ||
        "Code";


    const lines =
        code.split("\n");


    let numbers = "";

    let codeHTML = "";


    lines.forEach(
        function(line, index) {

            numbers +=
                '<div class="student-code-line">' +
                (index + 1) +
                '</div>';


            codeHTML +=
                '<div class="student-code-line">' +
                highlightCode(
                    line,
                    selectedLanguage
                ) +
                '</div>';

        }
    );


    return `

        <div class="student-code">

            <div class="student-code-title">
                ${title}
            </div>

            <div class="student-code-content">

                <div class="student-line-numbers">
                    ${numbers}
                </div>

                <div class="student-code-lines">
                    ${codeHTML}
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   PREVIEW
   ========================================================= */

function updatePreview() {

    let html = "";


    const notes =
        notesEditor.innerHTML;

    const code =
        codeInput.value;


    if (
        notes &&
        notes.trim() !== ""
    ) {

        html += notes;

    }


    if (
        code &&
        code.trim() !== ""
    ) {

        html += createStudentCode(
            code,
            language.value
        );

    }


    if (html.trim() === "") {

        editorPreview.innerHTML =
            '<span class="placeholder">Student preview will appear here.</span>';

    } else {

        editorPreview.innerHTML =
            html;

    }

}


/* =========================================================
   CLEAR EVERYTHING
   ========================================================= */

function clearEverything() {

    const answer =
        confirm(
            "Clear all notes and code?"
        );

    if (!answer) {
        return;
    }


    notesEditor.innerHTML = "";

    codeInput.value = "";


    localStorage.removeItem(
        "classViewNotes"
    );

    localStorage.removeItem(
        "classViewCode"
    );

    localStorage.removeItem(
        "classViewLanguage"
    );


    updateCodeNumbers();

    updatePreview();

}


/* =========================================================
   STUDENT PROTECTION
   ========================================================= */

studentContent.addEventListener(
    "copy",
    function(e) {
        e.preventDefault();
    }
);

studentContent.addEventListener(
    "cut",
    function(e) {
        e.preventDefault();
    }
);

studentContent.addEventListener(
    "contextmenu",
    function(e) {
        e.preventDefault();
    }
);

studentContent.addEventListener(
    "selectstart",
    function(e) {
        e.preventDefault();
    }
);


/* =========================================================
   START
   ========================================================= */

checkPage();

</script>

</body>
</html>
